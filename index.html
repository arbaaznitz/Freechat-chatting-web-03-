<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #0d1220;
            --panel: #161d2f;
            --panel-2: #1c2438;
            --line: #2b3550;
            --text: #e8ecf6;
            --muted: #8f9ab8;
            --mint: #5eead4;
            --coral: #ff8a7a;
            --amber: #fbbf24;
            --radius: 16px;
            --transition: all 0.25s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Sora', sans-serif;
            background: var(--ink);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            color-scheme: dark;
        }

        /* Lock Screen */
        .input-container {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background:
                radial-gradient(circle at 20% 15%, rgba(94,234,212,0.18), transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(255,138,122,0.16), transparent 45%),
                var(--ink);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .lock-card {
            background: var(--panel);
            padding: 44px 36px;
            border-radius: 24px;
            border: 1px solid var(--line);
            box-shadow: 0 30px 80px rgba(0,0,0,0.55);
            width: 100%;
            max-width: 380px;
            text-align: center;
            position: relative;
        }

        .lock-card::before {
            content: "";
            display: block;
            width: 44px; height: 44px;
            margin: 0 auto 22px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--mint), var(--coral));
            -webkit-mask: radial-gradient(circle at 50% 38%, transparent 0 7px, #000 8px);
            mask: radial-gradient(circle at 50% 38%, transparent 0 7px, #000 8px);
        }

        .lock-card h2 {
            margin-bottom: 24px;
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.01em;
            color: var(--text);
        }

        .input-container input[type="password"] {
            width: 100%;
            padding: 15px;
            background: var(--ink);
            color: var(--text);
            border: 1.5px solid var(--line);
            border-radius: 12px;
            font-family: inherit;
            font-size: 16px;
            letter-spacing: 0.2em;
            transition: var(--transition);
            margin-bottom: 16px;
            text-align: center;
        }

        .input-container input[type="password"]::placeholder { color: var(--muted); letter-spacing: normal; }

        .input-container input[type="password"]:focus {
            border-color: var(--mint);
            outline: none;
            box-shadow: 0 0 0 4px rgba(94,234,212,0.15);
        }

        .unlock-btn {
            background: var(--mint);
            color: #062b27;
            padding: 15px 30px;
            border: none;
            border-radius: 12px;
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            width: 100%;
        }

        .unlock-btn:hover { background: #7ff2e1; }
        .unlock-btn:focus-visible, #sendButton:focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; }

        /* Main Content */
        #btnContainer {
            max-width: 760px;
            margin: 0 auto;
            padding: 32px 20px 48px;
            animation: fadeIn 0.5s ease;
        }

        .chat-header {
            text-align: left;
            margin-bottom: 28px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--line);
        }

        .chat-header h2 {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.03em;
            margin-bottom: 4px;
        }

        .chat-header p { color: var(--muted); font-size: 14px; }

        .input-group {
            background: var(--panel);
            padding: 18px;
            border-radius: var(--radius);
            border: 1px solid var(--line);
            margin-bottom: 36px;
        }

        #username, #userInput {
            width: 100%;
            background: var(--ink);
            color: var(--text);
            border: 1.5px solid var(--line);
            border-radius: 12px;
            font-family: inherit;
            font-size: 15px;
            transition: var(--transition);
        }

        #username { padding: 12px 14px; margin-bottom: 12px; }
        #userInput { height: 120px; padding: 12px 14px; resize: vertical; margin-bottom: 14px; }

        #username::placeholder, #userInput::placeholder { color: var(--muted); }

        #username:focus, #userInput:focus {
            border-color: var(--mint);
            outline: none;
            box-shadow: 0 0 0 4px rgba(94,234,212,0.15);
        }

        #sendButton {
            background: #1faa59;
            color: #fff;
            width: 56px;
            height: 56px;
            padding: 0;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 0 0 auto;
            box-shadow: 0 6px 18px rgba(31,170,89,0.35);
        }

        #sendButton svg { display: block; margin-left: 2px; }
        #sendButton:hover { background: #25c068; transform: scale(1.06); }
        #sendButton:disabled { background: var(--line); box-shadow: none; cursor: not-allowed; transform: none; }

        /* Messages */
        .messages-container { padding: 0; }

        .messages-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .messages-header h2 { margin: 0; font-size: 18px; font-weight: 600; color: var(--muted); }

        .entry {
            background: var(--panel);
            padding: 16px 18px 12px;
            border-radius: var(--radius);
            margin-bottom: 12px;
            border: 1px solid var(--line);
            border-left-width: 4px;
        }

        .entry:has(.username-blue) { border-left-color: var(--mint); }
        .entry:has(.username-red) { border-left-color: var(--coral); }

        .username-blue, .username-red {
            font-size: 13px;
            font-weight: 600;
            padding: 3px 12px;
            border-radius: 999px;
            display: inline-block;
            margin-bottom: 8px;
        }

        .username-blue { background: rgba(94,234,212,0.12); color: var(--mint); }
        .username-red { background: rgba(255,138,122,0.12); color: var(--coral); }

        .message {
            font-size: 15px;
            line-height: 1.65;
            color: var(--text);
            margin: 6px 0;
            padding: 0 2px;
            word-wrap: break-word;
        }

        .timestamp {
            font-size: 12px;
            color: var(--muted);
            margin-top: 8px;
            text-align: right;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Loading Animation */
        .sending { position: relative; }

        .sending::after {
            content: '';
            width: 22px;
            height: 22px;
            border: 3px solid rgba(255,255,255,0.25);
            border-top-color: var(--text);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        @media (prefers-reduced-motion: reduce) {
            * { animation: none !important; transition: none !important; }
        }

        /* Responsive Design */
        @media screen and (max-width: 768px) {
            .lock-card { padding: 32px 22px; }
            #btnContainer { padding: 22px 15px 40px; }
            .chat-header h2 { font-size: 26px; }
            .input-group { padding: 14px; }
            .entry { padding: 14px 14px 10px; }
            #username, #userInput { font-size: 15px; }
            .message { font-size: 14px; }
        }

        /* Code formatting */
        .code-content {
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 13px;
            white-space: pre-wrap;
            background: var(--ink);
            color: var(--mint);
            border: 1px solid var(--line);
            padding: 12px;
            border-radius: 10px;
            margin: 5px 0;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <!-- Lock Screen -->
    <div class="input-container">
        <div class="lock-card">
            <h2>Welcome to Chat</h2>
            <input type="password" id="password" placeholder="Enter Password" autofocus>
            <button class="unlock-btn" onclick="unlockLinks()">Unlock Access</button>
        </div>
    </div>

    <!-- Main Content (Initially Hidden) -->
    <div id="btnContainer" style="display: none;">
        <div class="chat-header">
            <h2>Let's Chat</h2>
            <p>Join the conversation!</p>
        </div>

        <div class="input-group">
            <input id="username" type="text" placeholder="Enter your name (optional)">
            <textarea id="userInput" placeholder="Type your message..."></textarea>
            <button id="sendButton" onclick="saveText()" aria-label="Send message" title="Send message"><svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M4 3.8 L21.2 12 L4 20.2 L7.6 12 Z" fill="#fff" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"/><line x1="7.6" y1="12" x2="13.5" y2="12" stroke="#1faa59" stroke-width="1.8" stroke-linecap="round"/></svg></button>
        </div>

        <div class="messages-container">
            <div class="messages-header">
                <h2>Messages</h2>
            </div>
            <div id="content"></div>
        </div>
    </div>

    <script>
        // Lock system functionality
        function unlockLinks() {
            const encodedPassword = "ODc4Nw=="; // Base64 encoded password (1220)
            const passwordInput = document.getElementById("password");
            const enteredPassword = passwordInput.value;

            if (btoa(enteredPassword) === encodedPassword) {
                sessionStorage.setItem("accessGranted", "true");
                document.querySelector(".input-container").style.display = "none"; 
                document.getElementById("btnContainer").style.display = "block";
            } else {
                alert("Incorrect password! Access denied.");
                passwordInput.value = "";
                passwordInput.focus();
            }
        }

        // Unlock using Enter key
        document.getElementById("password").addEventListener("keydown", function(event) {
            if (event.key === "Enter") {
                unlockLinks();
            }
        });

        // Ensure password is required after every refresh
        window.onload = function() {
            sessionStorage.removeItem("accessGranted");
            document.getElementById("btnContainer").style.display = "none";
            
            // Enhanced focus handling
            const passwordInput = document.getElementById("password");
            passwordInput.focus();
            
            // Re-focus on password input when window regains focus
            window.addEventListener('focus', function() {
                if (document.querySelector(".input-container").style.display !== "none") {
                    passwordInput.focus();
                }
            });
        };

        // Disable Right Click
        document.addEventListener("contextmenu", function (event) {
            event.preventDefault();
        });

        // Disable Specific Key Combinations
        document.addEventListener("keydown", function (event) {
            if (
                event.key === "F12" || 
                (event.ctrlKey && event.shiftKey && (event.key === "I" || event.key === "J")) || 
                (event.ctrlKey && event.key === "U")
            ) {
                event.preventDefault();
            }
        });

        // Prevent Developer Tools via Debugger
        (function() {
            function detectDevTools() {
                debugger;
            }
            setInterval(detectDevTools, 100);
        })();

        // ... existing code ...
        const scriptURL = "https://script.google.com/macros/s/AKfycbxhMG7AL0tPefAPTP8Rtz9la_JnRx0xluetbUkDdlO1KwzY8ZLzhUDNyewN5R_GKhCF/exec";

        const sendIcon = document.getElementById("sendButton").innerHTML;

        function updateSendButtonState(isLoading) {
            const button = document.getElementById("sendButton");
            if (isLoading) {
                button.disabled = true;
                button.classList.add("sending");
                button.innerHTML = "";
            } else {
                button.disabled = false;
                button.classList.remove("sending");
                button.innerHTML = sendIcon;
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatMessage(text) {
            // First escape any HTML to prevent execution
            text = escapeHtml(text);
            
            // Replace newlines with <br> for normal text
            text = text.replace(/\\n/g, "<br>");

            // Check if the message contains code (starts with common code indicators)
            if (text.includes('<') || text.includes('{') || text.includes('function') || 
                text.includes('var ') || text.includes('let ') || text.includes('const ') ||
                text.includes('class ') || text.includes('import ') || text.includes('def ') ||
                text.includes('#!/') || text.includes('<?php')) {
                
                return `<div class="code-content">${text}</div>`;
            }

            return text;
        }

        function saveText() {
            let username = document.getElementById("username").value.trim() || "Anonymous";
            let text = document.getElementById("userInput").value.trim();

            if (text === "") {
                alert("Please enter a message before sending.");
                return;
            }

            updateSendButtonState(true);

            let now = new Date();
            let formattedTime = now.getHours().toString().padStart(2, '0') + ":" +
                               now.getMinutes().toString().padStart(2, '0') + " | " +
                               now.getDate().toString().padStart(2, '0') + "/" +
                               (now.getMonth() + 1).toString().padStart(2, '0') + "/" +
                               now.getFullYear().toString().slice(-2);

            let finalMessage = username + "||" + text.replace(/\n/g, "\\n") + "||" + formattedTime;

            fetch(scriptURL, {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: "text=" + encodeURIComponent(finalMessage)
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById("userInput").value = "";
                updateSendButtonState(false);
                loadContent();
            })
            .catch(error => {
                alert("Error sending message!");
                updateSendButtonState(false);
            });
        }

        function loadContent() {
            fetch(scriptURL)
            .then(response => response.json())
            .then(data => {
                let contentDiv = document.getElementById("content");
                let lines = data.content.split("\n").filter(line => line.trim() !== "");
                contentDiv.innerHTML = ""; 

                lines.reverse().forEach((line, index) => {
                    let parts = line.split("||");
                    if (parts.length < 3) return;

                    let username = parts[0].trim();
                    let messageText = parts[1].trim();
                    let timestamp = parts[2].trim();
                     
                    let entryDiv = document.createElement("div");
                    entryDiv.classList.add("entry");

                    let headerSpan = document.createElement("div");
                    headerSpan.classList.add(index % 2 === 0 ? "username-blue" : "username-red");
                    headerSpan.innerHTML = (lines.length - index) + ". " + escapeHtml(username);

                    let messageSpan = document.createElement("div");
                    messageSpan.classList.add("message");
                    messageSpan.innerHTML = formatMessage(messageText);

                    let timestampSpan = document.createElement("div");
                    timestampSpan.classList.add("timestamp");
                    timestampSpan.innerHTML = escapeHtml(timestamp);

                    entryDiv.appendChild(headerSpan);
                    entryDiv.appendChild(messageSpan);
                    entryDiv.appendChild(timestampSpan);

                    contentDiv.appendChild(entryDiv);
                });
            });
        }

        document.getElementById("userInput").addEventListener("keydown", function(event) {
            if (event.key === "Enter" && event.shiftKey) {
                event.preventDefault();
                saveText();
            }
        });

        loadContent();
        setInterval(loadContent, 5000);
    </script>

</body>
</html>
